<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모닝콜 스튜디오</title>
<style>
:root{
  --bg:#0e1014; --panel:#161920; --panel2:#1c2029; --line:#252a35; --line2:#323847;
  --fg:#e8eaf0; --dim:#8d95a8; --dim2:#646c7e;
  --tag:#c99cf0; --tagbg:#2a2136; --tagline:#4a3a5e;
  --ok:#7ee787; --err:#ff8079; --accent:#7c9cff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::placeholder{color:var(--dim2)}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:0 22px;height:58px;display:flex;gap:10px;align-items:center}
.brand{font-size:15px;font-weight:650;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
.sp{flex:1}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--accent)}
select.field{cursor:pointer}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#222733}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0d14;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.ico{border:1px solid var(--line);border-radius:8px;width:33px;height:33px;
  display:grid;place-items:center;color:var(--dim);font-size:15px;transition:.15s;flex:none}
.ico:hover{color:var(--fg);border-color:var(--line2)}
.ico.danger:hover{color:var(--err);border-color:var(--err)}

/* ── 레이아웃 ── */
main{max-width:1200px;margin:0 auto;padding:24px 22px 96px;
  display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:24px;align-items:start}
@media(max-width:920px){main{grid-template-columns:minmax(0,1fr);padding-bottom:110px}}

/* ── 단계 카드 ── */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:12px;transition:border-color .15s}
.stage:focus-within{border-color:var(--line2)}
.shead{display:flex;gap:9px;align-items:center;margin-bottom:12px}
.at{width:86px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sn{color:var(--dim2);font-size:12.5px;font-variant-numeric:tabular-nums}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:4px}
.tagpill{display:inline-flex;align-items:center;gap:6px;background:var(--tagbg);
  border:1px solid var(--tagline);color:var(--tag);border-radius:8px;
  padding:4px 7px 4px 10px;font-size:13px;line-height:1.35}
.tagpill b{font-weight:500}
.tagpill i{font-style:normal;color:var(--dim2);font-size:11px}
.tagpill button{color:var(--dim);font-size:14px;line-height:1;padding:0 2px;border-radius:4px}
.tagpill button:hover{color:var(--err)}
.tagempty{color:var(--dim2);font-size:12.5px;padding:2px 0}

.stage textarea{width:100%;min-height:72px;resize:vertical;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;line-height:1.7}
.stage textarea:focus{border-color:var(--accent)}
.sfoot{display:flex;gap:10px;align-items:center;margin-top:10px;
  font-size:13px;color:var(--dim);min-height:24px}

/* ── 사이드바 ── */
aside{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px;
  max-height:calc(100vh - 100px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}
.card.scroll{overflow:auto;min-height:0}
.card h2{margin:0 0 3px;font-size:13.5px;font-weight:650}
.card p.hint{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.55}

.row2{display:flex;gap:8px;margin-bottom:9px}
.row2>*{flex:1;min-width:0}
.vinfo{font-size:12.5px;color:var(--dim);line-height:1.5}
.vinfo:not(:empty){margin-bottom:9px}
.recording{color:var(--err) !important;border-color:var(--err) !important}

.search{width:100%;margin-bottom:12px}
.grp{margin-bottom:15px}
.grp:last-child{margin-bottom:0}
.grp h3{margin:0 0 8px;font-size:11px;color:var(--dim2);letter-spacing:.09em;
  text-transform:uppercase;font-weight:650}
.grp h3 span{text-transform:none;letter-spacing:0;color:var(--dim2);font-weight:400;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--tag);
  border-radius:8px;padding:5px 10px;font-size:13px;transition:.13s}
.chip:hover{border-color:var(--tag);background:var(--tagbg)}
.chip.on{background:var(--tagbg);border-color:var(--tag)}
.noresult{color:var(--dim2);font-size:12.5px;padding:6px 0}

/* ── 하단 바 ── */
footer{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(14,16,20,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:13px 22px;
  display:flex;gap:11px;align-items:center;justify-content:center;flex-wrap:wrap}
#log{font-size:13px;color:var(--dim)}
.ok{color:var(--ok)} .err{color:var(--err)} .busy{color:var(--accent)}
.empty{color:var(--dim2);text-align:center;padding:48px 0;font-size:14px;line-height:1.9}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0 13px}
[hidden]{display:none !important}
</style>
</head>
<body>

<header>
  <span class="brand">모닝콜 스튜디오</span>
  <input type="text" id="name" class="field" placeholder="모닝콜 이름" style="width:148px">
  <select id="saved" class="field" style="max-width:165px"><option value="">불러오기…</option></select>
  <span class="sp"></span>
  <select id="voice" class="field" style="max-width:210px"></select>
  <button class="ico danger" id="delvoice" title="이 목소리 삭제">×</button>
  <button class="btn" id="save">저장</button>
</header>

<main>
  <section>
    <div id="stages"></div>
    <button class="btn" id="add">＋ 단계 추가</button>
  </section>

  <aside>
    <div class="card">
      <h2>목소리 추가</h2>
      <p class="hint">10초 이상, 1~2분이 가장 좋아요. 조용한 곳에서 한 사람만.</p>
      <div class="row2">
        <button class="btn" id="rec">● 녹음</button>
        <button class="btn" id="pickfile">파일 선택</button>
        <input type="file" id="file" accept="audio/*" hidden>
      </div>
      <div id="vinfo" class="vinfo"></div>
      <div class="row2" id="vmake" hidden>
        <input type="text" id="vname" class="field" placeholder="목소리 이름">
        <button class="btn primary" id="makevoice" style="flex:0 0 auto">만들기</button>
      </div>
      <div id="vlog" class="vinfo"></div>
    </div>

    <div class="card scroll">
      <h2>연기 지시</h2>
      <p class="hint">대사 칸을 고른 뒤 누르면 그 단계에 붙어요. 여러 개 겹쳐도 돼요.</p>
      <input type="text" id="tagsearch" class="field search" placeholder="검색 — 화, 속삭, 한숨…">
      <div id="palette"></div>
    </div>
  </aside>
</main>

<footer>
  <button class="btn primary" id="build">전체 굽기</button>
  <button class="btn" id="reveal" disabled>폴더 열기</button>
  <span id="log"></span>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const el = (t, p = {}) => Object.assign(document.createElement(t), p);

let GROUPS = [];          // 서버에서 받은 태그 사전
let stages = [];          // [{ at, tags:[한글], text }]
let active = 0;           // 팔레트 클릭이 향할 단계
let lastDir = '';

/* ───────── 단계 ───────── */
function render() {
  const box = $('#stages');
  box.innerHTML = '';
  if (!stages.length) {
    box.append(el('div', { className: 'empty',
      textContent: '단계를 추가해서 시작하세요\n안 일어나면 또 울리게, 여러 단계로 만들 수 있어요' }));
    box.firstChild.style.whiteSpace = 'pre-line';
    return;
  }

  stages.forEach((s, i) => {
    const card = el('div', { className: 'stage' });

    // 머리: 시간 · 순서 · 조작
    const head = el('div', { className: 'shead' });
    const at = el('input', { className: 'field at', type: 'text', value: s.at || '', placeholder: '07:00' });
    at.oninput = () => { s.at = at.value; };
    at.onfocus = () => { active = i; };
    head.append(at, el('span', { className: 'sn', textContent: `${i + 1}번째` }), el('span', { className: 'sp' }));
    const mk = (txt, title, fn) => {
      const b = el('button', { className: 'ico', textContent: txt, title });
      b.onclick = fn; return b;
    };
    head.append(
      mk('↑', '위로', () => { if (i > 0) { [stages[i-1], stages[i]] = [stages[i], stages[i-1]]; active = i-1; render(); } }),
      mk('↓', '아래로', () => { if (i < stages.length-1) { [stages[i+1], stages[i]] = [stages[i], stages[i+1]]; active = i+1; render(); } }),
      Object.assign(mk('×', '삭제', () => { stages.splice(i, 1); active = Math.max(0, i-1); render(); }), { className: 'ico danger' }),
    );

    // 태그 칩
    const tagbox = el('div', { className: 'tags' });
    if (!s.tags.length) {
      tagbox.append(el('span', { className: 'tagempty', textContent: '연기 지시 없음 — 오른쪽에서 골라보세요' }));
    } else {
      s.tags.forEach((t, ti) => {
        const pill = el('span', { className: 'tagpill' });
        pill.append(el('b', { textContent: t }));
        const en = enOf(t);
        if (en) pill.append(el('i', { textContent: en }));
        const x = el('button', { textContent: '×', title: '빼기' });
        x.onclick = () => { s.tags.splice(ti, 1); render(); };
        pill.append(x);
        tagbox.append(pill);
      });
    }

    // 대사
    const ta = el('textarea', { value: s.text || '', placeholder: '여기에 대사만 쓰세요. 연기 지시는 위에 붙어요.' });
    ta.oninput = () => { s.text = ta.value; };
    ta.onfocus = () => { active = i; highlightActive(); };

    // 발
    const foot = el('div', { className: 'sfoot' });
    const play = el('button', { className: 'btn', textContent: '▶ 미리듣기' });
    const status = el('span', {});
    play.onclick = async () => {
      if (!ta.value.trim()) { status.className = 'err'; status.textContent = '대사를 먼저 쓰세요'; return; }
      play.disabled = true; status.className = 'busy'; status.textContent = '굽는 중…';
      try {
        const r = await fetch('/api/tts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tags: s.tags, text: ta.value, referenceId: $('#voice').value }),
        });
        if (!r.ok) throw new Error((await r.json()).error || r.status);
        const a = new Audio(URL.createObjectURL(await r.blob()));
        status.textContent = '재생 중';
        a.onended = () => { status.textContent = ''; status.className = ''; };
        a.play();
      } catch (e) { status.className = 'err'; status.textContent = String(e.message).slice(0, 64); }
      finally { play.disabled = false; }
    };
    foot.append(play, status);

    card.append(head, tagbox, ta, foot);
    box.append(card);
  });
  highlightActive();
}

function highlightActive() {
  document.querySelectorAll('.stage').forEach((c, i) => {
    c.style.borderColor = i === active ? 'var(--line2)' : '';
  });
}

function enOf(ko) {
  for (const g of GROUPS) for (const [k, en] of g.items) if (k === ko) return en.join(' · ');
  return '';           // 사전에 없으면 자연어 지시로 그대로 전달된다
}

$('#add').onclick = () => {
  const last = stages.at(-1);
  let next = '07:00';
  if (last && /^[0-9]{1,2}:[0-9]{2}$/.test(last.at || '')) {
    const [h, m] = last.at.split(':').map(Number);
    const t = h * 60 + m + 10;
    next = `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  }
  stages.push({ at: next, tags: [], text: '' });
  active = stages.length - 1;
  render();
};

/* ───────── 연기 지시 팔레트 ───────── */
function buildPalette(filter = '') {
  const box = $('#palette');
  box.innerHTML = '';
  const q = filter.trim();
  let hit = 0;

  for (const g of GROUPS) {
    const items = q ? g.items.filter(([ko, en]) =>
      ko.includes(q) || en.some((e) => e.toLowerCase().includes(q.toLowerCase()))) : g.items;
    if (!items.length) continue;
    hit += items.length;

    const grp = el('div', { className: 'grp' });
    const h = el('h3', { textContent: g.name });
    if (g.hint && !q) h.append(el('span', { textContent: g.hint }));
    grp.append(h);

    const chips = el('div', { className: 'chips' });
    for (const [ko] of items) {
      const c = el('button', { className: 'chip', textContent: ko, title: enOf(ko) });
      if (stages[active]?.tags.includes(ko)) c.classList.add('on');
      c.onclick = () => toggleTag(ko);
      chips.append(c);
    }
    grp.append(chips);
    box.append(grp);
  }
  if (!hit) box.append(el('div', { className: 'noresult', textContent: '없어요. 대사 칸에 직접 써도 돼요 — 사전에 없는 한글은 그대로 전달됩니다.' }));
}

function toggleTag(ko) {
  if (!stages.length) { stages.push({ at: '07:00', tags: [], text: '' }); active = 0; }
  const s = stages[active];
  const i = s.tags.indexOf(ko);
  if (i >= 0) s.tags.splice(i, 1); else s.tags.push(ko);
  render();
  buildPalette($('#tagsearch').value);
}

$('#tagsearch').oninput = (e) => buildPalette(e.target.value);

/* ───────── 저장 / 불러오기 ───────── */
async function refreshSaved() {
  const d = await (await fetch('/api/calls')).json();
  const sel = $('#saved');
  sel.innerHTML = '<option value="">불러오기…</option>';
  for (const it of d.items) sel.append(el('option', { value: it.name, textContent: `${it.name} (${it.stages})` }));
}

$('#saved').onchange = async (e) => {
  const name = e.target.value;
  if (!name) return;
  const c = await (await fetch('/api/calls/' + encodeURIComponent(name))).json();
  $('#name').value = name;
  stages = (c.stages || []).map((s) => ({ at: s.at, tags: s.tags || [], text: s.text || '' }));
  active = 0;
  render(); buildPalette($('#tagsearch').value);
  log(`${name} 불러옴`, 'ok');
  e.target.value = '';
};

$('#save').onclick = async () => {
  const name = $('#name').value.trim();
  if (!name) return log('이름을 먼저 정해주세요', 'err');
  const r = await fetch('/api/calls/' + encodeURIComponent(name), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: name, stages }),
  });
  if (r.ok) { log('저장됨', 'ok'); refreshSaved(); } else log('저장 실패', 'err');
};

/* ───────── 전체 굽기 ───────── */
$('#build').onclick = async () => {
  const name = $('#name').value.trim();
  if (!name) return log('이름을 먼저 정해주세요', 'err');
  const use = stages.filter((s) => s.text && s.text.trim());
  if (!use.length) return log('대사가 하나도 없어요', 'err');

  $('#build').disabled = true;
  log(`${use.length}개 굽는 중…`, 'busy');
  try {
    const r = await fetch('/api/build', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, stages: use, referenceId: $('#voice').value }),
    });
    const d = await r.json();
    const ok = d.results.filter((x) => x.ok).length;
    lastDir = d.dir; $('#reveal').disabled = false;
    log(`${ok}/${d.results.length} 완성 · ${d.dir}`, ok === d.results.length ? 'ok' : 'err');
  } catch (e) { log(String(e.message), 'err'); }
  finally { $('#build').disabled = false; }
};

$('#reveal').onclick = () => fetch('/api/reveal', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ dir: lastDir }),
});

function log(m, c) { const l = $('#log'); l.className = c || ''; l.textContent = m; }
function vlog(m, c) { const l = $('#vlog'); l.className = 'vinfo ' + (c || ''); l.textContent = m; }

/* ───────── 목소리 추가 ───────── */
let blobToClone = null, recorder = null, chunks = [], recTimer = null, recStart = 0;

function duration(blob) {
  return new Promise((done) => {
    const a = new Audio(URL.createObjectURL(blob));
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : null);
    a.onerror = () => done(null);
  });
}

async function stageBlob(blob, label) {
  blobToClone = blob;
  const d = await duration(blob);
  const secs = d ? Math.round(d) : null;
  let msg = `${label} · ${(blob.size / 1048576).toFixed(2)}MB` + (secs ? ` · ${secs}초` : '');
  let cls = '';
  if (secs !== null && secs < 10) { msg += ' — 10초 미만이라 품질이 많이 떨어져요'; cls = 'err'; }
  else if (secs !== null && secs < 30) msg += ' — 1분쯤 되면 더 좋아요';
  $('#vinfo').className = 'vinfo ' + cls;
  $('#vinfo').textContent = msg;
  $('#vmake').hidden = false;
}

$('#pickfile').onclick = () => $('#file').click();
$('#file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  stageBlob(f, f.name);
  if (!$('#vname').value) $('#vname').value = f.name.replace(/\.[^.]+$/, '');
};

$('#rec').onclick = async () => {
  if (recorder && recorder.state === 'recording') return recorder.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    recorder = new MediaRecorder(stream, { mimeType: mime });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      clearInterval(recTimer);
      stream.getTracks().forEach((t) => t.stop());
      $('#rec').textContent = '● 녹음';
      $('#rec').classList.remove('recording');
      stageBlob(new Blob(chunks, { type: 'audio/webm' }), '방금 녹음');
      vlog('');
    };
    recorder.start();
    recStart = Date.now();
    $('#rec').classList.add('recording');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $('#rec').textContent = `■ 정지 ${String((s / 60) | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 250);
    vlog('녹음 중… 평소 말투로, 감정은 넣지 않아도 돼요');
  } catch (e) { vlog('마이크를 쓸 수 없어요: ' + e.message, 'err'); }
};

$('#makevoice').onclick = async () => {
  if (!blobToClone) return vlog('먼저 녹음하거나 파일을 고르세요', 'err');
  const title = $('#vname').value.trim();
  if (!title) return vlog('목소리 이름을 정해주세요', 'err');
  $('#makevoice').disabled = true;
  vlog('올리는 중… 20초쯤 걸려요');
  try {
    const r = await fetch('/api/clone', {
      method: 'POST',
      headers: {
        'X-Title': encodeURIComponent(title),
        'X-Filename': encodeURIComponent(blobToClone.name || 'rec.webm'),
        'X-Mime': blobToClone.type || 'application/octet-stream',
      },
      body: blobToClone,
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    await refreshVoices(d.id);
    vlog(`"${d.title}" 만들어졌어요 — 바로 미리듣기 해보세요`, 'ok');
    $('#vmake').hidden = true; $('#vinfo').textContent = ''; blobToClone = null;
  } catch (e) { vlog(String(e.message).slice(0, 150), 'err'); }
  finally { $('#makevoice').disabled = false; }
};

$('#delvoice').onclick = async () => {
  const sel = $('#voice');
  if (!sel.value) return vlog('기본 보이스는 지울 수 없어요', 'err');
  if (!confirm(`"${sel.selectedOptions[0].textContent}" 을(를) 삭제할까요? 되돌릴 수 없어요.`)) return;
  const r = await fetch('/api/voices/' + sel.value, { method: 'DELETE' });
  if (r.ok) { await refreshVoices(''); vlog('삭제됨', 'ok'); } else vlog('삭제 실패', 'err');
};

async function refreshVoices(select) {
  const d = await (await fetch('/api/voices')).json();
  const sel = $('#voice');
  const keep = select !== undefined ? select : sel.value;
  sel.innerHTML = '';
  sel.append(el('option', { value: '', textContent: '기본 보이스' }));
  for (const v of d.items) sel.append(el('option', { value: v.id, textContent: v.title }));
  sel.value = keep || d.current || '';
}

/* ───────── 시작 ───────── */
(async function init() {
  GROUPS = (await (await fetch('/api/tags')).json()).groups;
  buildPalette();
  await refreshVoices();
  await refreshSaved();
  stages = [{ at: '07:00', tags: [], text: '' }];
  render();
})();
</script>
